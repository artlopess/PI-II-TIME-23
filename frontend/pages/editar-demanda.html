<!-- Arthur Lopes Santos Silva -- Tela de Edição de Demanda -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar demanda - Acompanhamento de Demandas</title>
    <link rel="stylesheet" href="../styles/demanda.css">
</head>
<body>
    <div class="card">

    <!-- Logo do sistema -->
    <div class="logo">
      <div class="logo-quadrado">F</div>
      <div class="logo-nome">Fluxo</div>
    </div>

    <h1>Editar demanda</h1>

    <p class="subtitulo">
        Alterações de status, responsável, prioridade e prazo ficam registradas no histórico.
    </p>

    <!-- Usa a mesma validação da tela de cadastro -->
    <form onsubmit="return validarFormulario()">

        <!-- Campo: título, já preenchido -->
        <div class="campo">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" value="Corrigir cálculo do frete para pedidos acima de R$ 200">
            <p class="erro" id="erro-titulo"></p>
        </div>

        <!-- Campo: descrição, já preenchida -->
        <div class="campo">
            <label for="descricao">Descrição *</label>
            <textarea id="descricao">O frete continua sendo cobrado em pedidos acima de R$ 200, mesmo com a regra de frete grátis ativa. Para reproduzir: adicionar três itens que somem mais de R$ 200 e avançar até a tela de pagamento.</textarea>
            <p class="erro" id="erro-descricao"></p>
        </div>

        <div class="linha-dupla">

            <div class="campo">
                <label for="tipo">Tipo *</label>
                <select id="tipo">
                    <option value="">Selecione</option>
                    <option value="Tarefa">Tarefa</option>
                    <option value="Defeito" selected>Defeito</option>
                    <option value="Melhoria">Melhoria</option>
                    <option value="Documentacao">Documentação</option>
                </select>
                <p class="erro" id="erro-tipo"></p>
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade *</label>
                <select id="prioridade">
                    <option value="">Selecione</option>
                    <option value="Critica">Crítica</option>
                    <option value="Alta" selected>Alta</option>
                    <option value="Media">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>
                <p class="erro" id="erro-prioridade"></p>
            </div>

        </div>

        <div class="linha-dupla">

            <div class="campo">
                <label for="projeto">Projeto *</label>
                <select id="projeto">
                    <option value="">Selecione um projeto</option>
                    <option value="1">Portal do Aluno</option>
                    <option value="2" selected>App de Entregas</option>
                    <option value="3">Sistema Financeiro</option>
                </select>
                <p class="erro" id="erro-projeto"></p>
            </div>

            <div class="campo">
                <label for="responsavel">Responsável</label>
                <select id="responsavel">
                    <option value="">Sem responsável por enquanto</option>
                    <option value="1">Ana Ribeiro</option>
                    <option value="2" selected>Bruno Tavares</option>
                    <option value="3">Camila Duarte</option>
                </select>
            </div>

        </div>

        <div class="linha-dupla">

            <div class="campo">
                <label for="prazo">Prazo de finalização</label>
                <input type="date" id="prazo" value="2026-10-15">
                <p class="erro" id="erro-prazo"></p>
            </div>

            <div class="campo">
                <label for="status">Status *</label>
                <!-- Na edição o status pode mudar, respeitando as transições permitidas.
                     Concluída não aparece porque a demanda precisa passar por Em revisão -->
                <select id="status">
                    <option value="">Selecione</option>
                    <option value="EmAndamento" selected>Em andamento</option>
                    <option value="EmRevisao">Em revisão</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
                <p class="erro" id="erro-status"></p>
            </div>

        </div>

        <!-- Datas preenchidas automaticamente pelo sistema -->
        <table class="registro">
            <tr>
                <th>Data de criação</th>
                <td>18/08/2026 09:12</td>
            </tr>
            <tr>
                <th>Última atualização</th>
                <td>24/08/2026 15:40</td>
            </tr>
        </table>

        <!-- Mensagem exibida quando todos os campos estão corretos -->
        <p class="sucesso" id="mensagem-sucesso"></p>

        <!-- Botões de ação -->
        <div class="acoes">
            <div class="botao-cancelar">Cancelar</div>
            <button type="submit" class="botao-salvar">Salvar alterações</button>
        </div>

    </form>

    <p class="rodape">
        Sistema de Acompanhamento de Demandas de Desenvolvimento
    </p>

  </div>

  <!-- O script fica no final para carregar depois que a página já existe -->
  <script src="../scripts/demanda.js"></script>

</body>
</html>
