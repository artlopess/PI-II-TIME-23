<!-- Arthur Lopes Santos Silva - Tela de Cadastro de Demanda -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova demanda - Acompanhamento de Demandas</title>
    <link rel="stylesheet" href="../styles/demanda.css">
</head>
<body>
    <div class="card">

    <!-- Logo do sistema -->
    <div class="logo">
      <div class="logo-quadrado">F</div>
      <div class="logo-nome">Fluxo</div>
    </div>

    <h1>Nova demanda</h1>

    <p class="subtitulo">
        Descreva a atividade e escolha o projeto. O responsável pode ser definido depois.
    </p>

    <!-- O onsubmit chama a validação antes de enviar o formulário.
         Se a função devolver false, o envio é cancelado. -->
    <form onsubmit="return enviarFormulario()">

        <!-- Campo: título -->
        <div class="campo">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" placeholder="Ex.: Corrigir cálculo do frete no carrinho">
            <!-- A mensagem de erro deste campo aparece aqui -->
            <p class="erro" id="erro-titulo"></p>
        </div>

        <!-- Campo: descrição -->
        <div class="campo">
            <label for="descricao">Descrição *</label>
            <textarea id="descricao" placeholder="Explique o que precisa ser feito ou como reproduzir o problema."></textarea>
            <p class="erro" id="erro-descricao"></p>
        </div>

        <!-- Campos: tipo e prioridade, lado a lado -->
        <div class="linha-dupla">

            <div class="campo">
                <label for="tipo">Tipo *</label>
                <select id="tipo">
                    <option value="">Selecione</option>
                    <option value="Tarefa">Tarefa</option>
                    <option value="Defeito">Defeito</option>
                    <option value="Melhoria">Melhoria</option>
                    <option value="Documentação">Documentação</option>
                </select>
                <p class="erro" id="erro-tipo"></p>
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade *</label>
                <select id="prioridade">
                    <option value="">Selecione</option>
                    <option value="Crítica">Crítica</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>
                <p class="erro" id="erro-prioridade"></p>
            </div>

        </div>

        <!-- Campos: projeto e responsável, lado a lado -->
        <div class="linha-dupla">

            <div class="campo">
                <label for="projeto">Projeto *</label>
                <!-- Os projetos já vêm cadastrados no banco de dados -->
                <select id="projeto">
                    <!-- Preenchido por GET /projetos, no demanda.js -->
                    <option value="">Carregando projetos...</option>
                </select>
                <p class="erro" id="erro-projeto"></p>
            </div>

            <div class="campo">
                <label for="responsavel">Responsável</label>
                <!-- Campo opcional: pode ficar em branco e ser atribuído depois -->
                <select id="responsavel">
                    <!-- Preenchido por GET /usuarios, no demanda.js -->
                    <option value="">Sem responsável por enquanto</option>
                </select>
            </div>

        </div>

        <!-- Campos: prazo e status, lado a lado -->
        <div class="linha-dupla">

            <div class="campo">
                <label for="prazo">Prazo de finalização</label>
                <input type="date" id="prazo">
                <p class="dica">Prazos em feriado nacional são recusados pelo servidor.</p>
                <p class="erro" id="erro-prazo"></p>
            </div>

            <div class="campo">
                <label for="status-inicial">Status</label>
                <!-- Toda demanda nasce com status Aberta, por isso o campo fica bloqueado -->
                <input type="text" id="status-inicial" value="Aberta" disabled>
                <p class="dica">Definido automaticamente na criação.</p>
            </div>

        </div>

        <!-- Mensagem exibida quando todos os campos estão corretos -->
        <!-- Erros devolvidos pela API (400, 404, servidor fora do ar) -->
        <p class="erro" id="aviso-api"></p>

        <!-- Mensagem de sucesso -->
        <p class="sucesso" id="mensagem-sucesso"></p>

        <!-- Botões de ação -->
        <div class="acoes">
            <div class="botao-cancelar">Cancelar</div>
            <button type="submit" class="botao-salvar">Salvar demanda</button>
        </div>

    </form>

    <p class="rodape">
        Sistema de Acompanhamento de Demandas de Desenvolvimento
    </p>

  </div>

  <!-- O script fica no final para carregar depois que a página já existe -->
  <script src="../scripts/demanda.js"></script>

</body>
</html>
