<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Dashboard-Fluxo</title>

</head>
<body>
  <div class=" sidebar">

    <div class="logo">
      <div class="logo-quadrado">F</div>

    </div>

    <nav>

    </div>

    <div class="dashboard">

      <h2>Dashboard</h2>
      <div class="dashboard-kpis">

      <div class="infos">Abertas<hr>-</div>

      <div class="infos">Concluidas<hr>-</div>
      <div class="infos">Canceladas<hr>-</div>
      </div>
      <br><br>
    <div class="linha-card">
      <div class="prioridade">
        <p>Por Prioridade</p>
        <div class="row">
          <span class="prioridade-label critica">Crítica</span>
          <div class="values">-</div>
           </div>
           <hr>
          <div class="row">
            <span class="prioridade-label alta">Alta</span>
            <div class="values">-</div>
        </div>
        <hr>
        <div class="row">
          <span class="prioridade-label media">Média</span>
          <div class="values">-</div>
        </div>
        <hr>
        <div class="row">
          <span class="prioridade-label baixa">Baixa</span>
          <div class="values">-</div>
        </div>
    </div> 
      <div class="tipos">
        <p>Por tipos</p>
        <div class="row">
          <span>Tarefas</span>
          <div class="values">-</div>
        </div>
        <hr>
        <div class="row">
          <span>Defeito</span>
          <div class="values">-</div>
        </div>
        <hr>
        <div class="row">
          <span>Melhoria</span>
          <div class="values">-</div>
        </div>
        <hr>
        <div class="row">
          <span>Documentação</span>
          <div class="values">-</div>
        </div>
      </div>
    </div>
    <br><br>

    <div class="prox">
      <p>Criticas em aberto</p>
      <div class="values">-</div>
      <div class="values">-</div>
      <hr>
      <p>Proximas do prazo</p>
      <div class="values">-</div>
      <div class="values">-</div>
    

    </div>
