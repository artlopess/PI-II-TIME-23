<!DOCTYPE html>
<!-- Pedro Businari Kawamoto - Tela de Detalhes da Demanda -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes das demandas</title>
    <link rel="stylesheet" href="../styles/detalhes.css">
</head>
<body>

    <!-- Container principal: cards empilhados, com os detalhes em destaque -->
    <div class="dashboard-container">

        <!-- Mensagens de erro retornadas pela API (400, 404...) aparecem aqui -->
        <div id="erro" class="erro" hidden></div>

        <!-- CARD PRINCIPAL: Detalhes da Demanda (<td> preenchidos pelo detalhes.js via GET /demandas/:id) -->
        <div class="card">
            <div class="logo">
                <div class="logo-quadrado">F</div>
                <div class="logo-nome">Fluxo</div>
            </div>
            <h1>Detalhes da demanda</h1>

            <table>
                <tr><th>Título</th><td id="titulo"></td></tr>
                <tr><th>Descrição</th><td id="descricao"></td></tr>
                <tr><th>Tipo</th><td id="tipo"></td></tr>
                <tr><th>Prioridade</th><td id="prioridade"></td></tr>
                <tr><th>Status</th><td id="status"></td></tr>
                <tr><th>Projeto associado</th><td id="projetoId"></td></tr>
                <tr><th>Responsável</th><td id="responsavelNome"></td></tr>
                <tr><th>Data de criação</th><td id="dataCriacao"></td></tr>
                <tr><th>Data da última atualização</th><td id="dataAtualizacao"></td></tr>
                <tr><th>Prazo de finalização</th><td id="prazo"></td></tr>
            </table>

            <!-- Histórico escondido: só aparece ao clicar no botão (comportamento nativo do <details>) -->
            <details class="historico">
                <summary>Histórico de alterações</summary>
                <ul id="historico">
                    <li>Histórico ainda não disponível.</li>
                </ul>
            </details>

            <p class="rodape">Sistema de Acompanhamento de demandas de desenvolvimento</p>
        </div>

        <!-- CARD DE COMENTÁRIOS (lista via GET e envio via POST em /demandas/:id/comentarios) -->
        <div class="card card-comentarios">
            <h2>Comentários</h2>
            <ul id="comentarios"></ul>

            <textarea id="novo-comentario" placeholder="Escreva um comentário"></textarea>
            <button id="btn-comentar" type="button">Comentar</button>
        </div>

    </div>

    <!-- Script da tela: carrega a demanda e os comentários da API -->
    <script src="../scripts/detalhes.js"></script>
</body>
</html>
